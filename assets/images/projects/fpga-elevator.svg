<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260">
  <rect width="400" height="260" fill="#1e1b4b"/>
  <g transform="translate(50,30)">
    <!-- elevator shaft -->
    <rect x="0" y="0" width="120" height="200" fill="#312e81" stroke="#a5b4fc" stroke-width="2"/>
    <line x1="0" y1="66" x2="120" y2="66" stroke="#a5b4fc" stroke-dasharray="4 4"/>
    <line x1="0" y1="132" x2="120" y2="132" stroke="#a5b4fc" stroke-dasharray="4 4"/>
    <!-- floor labels -->
    <text x="60" y="30" font-family="Lato, Arial" font-size="14" text-anchor="middle" fill="#fde68a" font-weight="700">3</text>
    <text x="60" y="100" font-family="Lato, Arial" font-size="14" text-anchor="middle" fill="#fde68a" font-weight="700">2</text>
    <text x="60" y="170" font-family="Lato, Arial" font-size="14" text-anchor="middle" fill="#fde68a" font-weight="700">1</text>
    <!-- car -->
    <rect x="30" y="110" width="60" height="55" rx="4" fill="#fbbf24" stroke="#92400e" stroke-width="2"/>
    <line x1="60" y1="110" x2="60" y2="165" stroke="#92400e" stroke-width="2"/>
  </g>
  <!-- FSM bubble -->
  <g transform="translate(220,40)">
    <rect x="0" y="0" width="140" height="170" rx="8" fill="#0f172a" stroke="#a5b4fc" stroke-width="2"/>
    <text x="70" y="22" font-family="Lato, Arial" font-size="11" text-anchor="middle" fill="#a5b4fc" font-weight="700">Moore FSM</text>
    <circle cx="35" cy="55" r="14" fill="none" stroke="#fbbf24" stroke-width="2"/>
    <text x="35" y="59" font-family="monospace" font-size="10" text-anchor="middle" fill="#fbbf24">S0</text>
    <circle cx="105" cy="55" r="14" fill="none" stroke="#fbbf24" stroke-width="2"/>
    <text x="105" y="59" font-family="monospace" font-size="10" text-anchor="middle" fill="#fbbf24">S1</text>
    <circle cx="35" cy="115" r="14" fill="none" stroke="#fbbf24" stroke-width="2"/>
    <text x="35" y="119" font-family="monospace" font-size="10" text-anchor="middle" fill="#fbbf24">S2</text>
    <circle cx="105" cy="115" r="14" fill="none" stroke="#fbbf24" stroke-width="2"/>
    <text x="105" y="119" font-family="monospace" font-size="10" text-anchor="middle" fill="#fbbf24">S3</text>
    <path d="M49,55 L91,55" stroke="#a5b4fc" fill="none" marker-end="url(#arr)"/>
    <path d="M35,69 L35,101" stroke="#a5b4fc" fill="none"/>
    <path d="M105,69 L105,101" stroke="#a5b4fc" fill="none"/>
    <text x="70" y="155" font-family="monospace" font-size="9" text-anchor="middle" fill="#94a3b8">9-state loop</text>
  </g>
  <text x="200" y="240" font-family="Lato, Arial" font-size="14" text-anchor="middle" fill="#a5b4fc" font-weight="700" letter-spacing="2">FPGA ELEVATOR</text>
</svg>
